name: PhotographersPocketKnife
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, pt-PT]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "7"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  PhotographersPocketKnife:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - DesignSystem
      - Modules
      - Localization
    dependencies:
      - package: Sparkle
    entitlements:
      path: App/PhotographersPocketKnife.entitlements
      properties:
        # Build sem Developer ID: o Sparkle vem assinado por outra equipa e o hardened runtime recusa-o sem isto.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
        SUFeedURL: https://raw.githubusercontent.com/VidiPT89/PhotographersPocketKnife/main/appcast.xml
        SUPublicEDKey: JR3oyybL8vgqqGlAUMN/JlY5AsIGgn2pEbj6H+/aXgA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotographersPocketKnife
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "© David Arsénio Martins"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  PhotographersPocketKnifeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PhotographersPocketKnife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/Contents/MacOS/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PhotographersPocketKnife:
    build:
      targets:
        PhotographersPocketKnife: all
    test:
      targets:
        - PhotographersPocketKnifeTests
