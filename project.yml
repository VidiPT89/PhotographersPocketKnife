name: PhotographersPocketKnife
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, pt-PT]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "96"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  PhotographersPocketKnife-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes: ["Info.plist"]
      - Core
      - DesignSystem
      - Localization
      - App/AppState.swift
      - App/ShortcutStore.swift
      - App/SplashScreenView.swift
      - Modules/Culling/CullingModel.swift
      - Modules/Culling/DenoiseQueue.swift
      - Modules/Culling/WatchFolderService.swift
      - Modules/Upload/HotFolderService.swift
      - Modules/Editing/EditCanvas.swift
      - Modules/Editing/EditingModel.swift
      - Modules/Editing/AdjustmentPanel.swift
      - Modules/Editing/LocalAdjustments.swift
      - Modules/Editing/RemovalPanel.swift
      - App/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ZIPFoundation
      - framework: Vendor/curl.xcframework
        embed: false
      - sdk: libz.tbd
      - package: Citadel
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Photographer's Pocket Knife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryAddUsageDescription: Save your developed photographs to your photo library.
        NSLocalNetworkUsageDescription: Deliver photographs to your FTP, SFTP and WebDAV servers on your local network.
        NSMicrophoneUsageDescription: Dictate notes about a photograph to fill in its file info.
        NSSpeechRecognitionUsageDescription: Turn your dictated notes into text on this device for the file info.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        PRODUCT_NAME: PhotographersPocketKnife
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S769436W24
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: iOS/Transfer/PPK-Bridging-Header.h
  PhotographersPocketKnife-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [iOSUITests]
    dependencies:
      - target: PhotographersPocketKnife-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotographersPocketKnife-iOS
        DEVELOPMENT_TEAM: S769436W24
  PhotographersPocketKnife-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [iOSTests]
    dependencies:
      - target: PhotographersPocketKnife-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: S769436W24
  PhotographersPocketKnife:
    type: application
    platform: macOS
    sources:
      # Os Info.plist de cada versão não são recursos: copiados para Resources, a Apple vê um segundo bundle.
      - path: App
        excludes: ["Info.plist", "Info-AppStore.plist"]
      - Core
      - DesignSystem
      - Modules
      - Localization
    dependencies:
      - package: Sparkle
    entitlements:
      path: App/PhotographersPocketKnife.entitlements
      properties:
        # Build sem Developer ID: o Sparkle vem assinado por outra equipa e o hardened runtime recusa-o sem isto.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Photographer's Pocket Knife
        CFBundleName: PhotographersPocketKnife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 David Arsénio Martins"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
        SUFeedURL: https://raw.githubusercontent.com/VidiPT89/PhotographersPocketKnife/main/appcast.xml
        SUPublicEDKey: JR3oyybL8vgqqGlAUMN/JlY5AsIGgn2pEbj6H+/aXgA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  # Mac App Store: o mesmo código, com App Sandbox e sem Sparkle (a loja trata das atualizações).
  PhotographersPocketKnifeAppStore:
    type: application
    platform: macOS
    sources:
      # Os Info.plist de cada versão não são recursos: copiados para Resources, a Apple vê um segundo bundle.
      - path: App
        excludes: ["Info.plist", "Info-AppStore.plist"]
      - Core
      - DesignSystem
      - Modules
      - Localization
    entitlements:
      path: App/PhotographersPocketKnifeAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    info:
      path: App/Info-AppStore.plist
      properties:
        CFBundleDisplayName: Photographer's Pocket Knife
        CFBundleName: PhotographersPocketKnife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 David Arsénio Martins"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
    settings:
      base:
        PRODUCT_NAME: PhotographersPocketKnife
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S769436W24
        ENABLE_HARDENED_RUNTIME: YES
  PhotographersPocketKnifeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PhotographersPocketKnife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/Contents/MacOS/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Os mesmos testes, a correr dentro da app com sandbox (ex.: envios pelo curl/sftp do sistema).
  PhotographersPocketKnifeAppStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PhotographersPocketKnifeAppStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: S769436W24
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/Contents/MacOS/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PhotographersPocketKnifeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: PhotographersPocketKnife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotographersPocketKnife
schemes:
  PhotographersPocketKnife-iOS:
    build:
      targets:
        PhotographersPocketKnife-iOS: all
    test:
      targets:
        - PhotographersPocketKnife-iOSTests
        - PhotographersPocketKnife-iOSUITests
    archive:
      config: Release
  PhotographersPocketKnife:
    build:
      targets:
        PhotographersPocketKnife: all
    test:
      targets:
        - PhotographersPocketKnifeTests
  PhotographersPocketKnifeAppStore:
    build:
      targets:
        PhotographersPocketKnifeAppStore: all
    test:
      targets:
        - PhotographersPocketKnifeAppStoreTests
    archive:
      config: Release
  # Testes de interface à parte: precisam de permissão de Acessibilidade para controlar a app.
  PhotographersPocketKnifeUITests:
    build:
      targets:
        PhotographersPocketKnife: all
        PhotographersPocketKnifeUITests: [test]
    test:
      targets:
        - PhotographersPocketKnifeUITests
