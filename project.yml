name: PhotographersPocketKnife
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, pt-PT]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "80"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  PhotographersPocketKnife:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - DesignSystem
      - Modules
      - Localization
    dependencies:
      - package: Sparkle
    entitlements:
      path: App/PhotographersPocketKnife.entitlements
      properties:
        # Build sem Developer ID: o Sparkle vem assinado por outra equipa e o hardened runtime recusa-o sem isto.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Photographer's Pocket Knife
        CFBundleName: PhotographersPocketKnife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 David Arsénio Martins"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
        SUFeedURL: https://raw.githubusercontent.com/VidiPT89/PhotographersPocketKnife/main/appcast.xml
        SUPublicEDKey: JR3oyybL8vgqqGlAUMN/JlY5AsIGgn2pEbj6H+/aXgA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  # Mac App Store: o mesmo código, com App Sandbox e sem Sparkle (a loja trata das atualizações).
  PhotographersPocketKnifeAppStore:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - DesignSystem
      - Modules
      - Localization
    entitlements:
      path: App/PhotographersPocketKnifeAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    info:
      path: App/Info-AppStore.plist
      properties:
        CFBundleDisplayName: Photographer's Pocket Knife
        CFBundleName: PhotographersPocketKnife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 David Arsénio Martins"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
    settings:
      base:
        PRODUCT_NAME: PhotographersPocketKnife
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.PhotographersPocketKnife
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S769436W24
        ENABLE_HARDENED_RUNTIME: YES
  PhotographersPocketKnifeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PhotographersPocketKnife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/Contents/MacOS/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Os mesmos testes, a correr dentro da app com sandbox (ex.: envios pelo curl/sftp do sistema).
  PhotographersPocketKnifeAppStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PhotographersPocketKnifeAppStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: S769436W24
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotographersPocketKnife.app/Contents/MacOS/PhotographersPocketKnife"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PhotographersPocketKnifeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: PhotographersPocketKnife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotographersPocketKnife
schemes:
  PhotographersPocketKnife:
    build:
      targets:
        PhotographersPocketKnife: all
    test:
      targets:
        - PhotographersPocketKnifeTests
  PhotographersPocketKnifeAppStore:
    build:
      targets:
        PhotographersPocketKnifeAppStore: all
    test:
      targets:
        - PhotographersPocketKnifeAppStoreTests
    archive:
      config: Release
  # Testes de interface à parte: precisam de permissão de Acessibilidade para controlar a app.
  PhotographersPocketKnifeUITests:
    build:
      targets:
        PhotographersPocketKnife: all
        PhotographersPocketKnifeUITests: [test]
    test:
      targets:
        - PhotographersPocketKnifeUITests
